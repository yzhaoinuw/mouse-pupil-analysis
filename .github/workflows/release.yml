name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the branch-ancestry check below can resolve merge bases.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install -U pip build
          python -m build

      - name: Verify tag matches project version
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          project_version = pyproject["project"]["version"]
          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if project_version != tag_version:
              raise SystemExit(
                  f"Tag {tag_version!r} does not match pyproject version {project_version!r}."
              )
          print(f"Tag and project version agree: {project_version}")
          PY

      - name: Verify citation metadata matches project version
        run: |
          python - <<'PY'
          import pathlib, re, tomllib
          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          project_version = pyproject["project"]["version"]
          citation = pathlib.Path("CITATION.cff").read_text()
          match = re.search(r'^version:\s*"?([^"\n]+)"?\s*$', citation, re.MULTILINE)
          if match is None:
              raise SystemExit("CITATION.cff has no version field.")
          if match.group(1).strip() != project_version:
              raise SystemExit(
                  f"CITATION.cff version {match.group(1)!r} does not match "
                  f"pyproject version {project_version!r}."
              )
          print(f"Citation metadata agrees: {project_version}")
          PY

      - name: Verify the intended checkpoint and training log ship in both distributions
        run: |
          python - <<'PY'
          import pathlib, tarfile, zipfile

          def names(path):
              if path.suffix == ".whl":
                  with zipfile.ZipFile(path) as archive:
                      return archive.namelist()
              with tarfile.open(path) as archive:
                  return archive.getnames()

          # Resolve what the installed package would actually select, so a release
          # cannot ship a different checkpoint than the one inference will load.
          checkpoint_dir = pathlib.Path("pupil_tracking/checkpoints")
          repo_checkpoints = sorted(p.name for p in checkpoint_dir.glob("*.pth"))
          if len(repo_checkpoints) != 1:
              raise SystemExit(
                  f"Expected exactly one packaged checkpoint, found {repo_checkpoints}. "
                  "Update this check deliberately if the packaging policy changed."
              )
          expected_checkpoint = repo_checkpoints[0]
          expected_log = f"training_log_{pathlib.Path(expected_checkpoint).stem}.txt"
          if not (checkpoint_dir / expected_log).is_file():
              raise SystemExit(f"Missing training log {expected_log} for {expected_checkpoint}.")

          distributions = sorted(pathlib.Path("dist").iterdir())
          if not distributions:
              raise SystemExit("No distributions were built.")

          for distribution in distributions:
              members = names(distribution)
              if not any(n.endswith(f"checkpoints/{expected_checkpoint}") for n in members):
                  raise SystemExit(f"{distribution.name} is missing {expected_checkpoint}.")
              if not any(n.endswith(f"checkpoints/{expected_log}") for n in members):
                  raise SystemExit(f"{distribution.name} is missing {expected_log}.")
              stray = [
                  n for n in members
                  if n.endswith(".pth") and not n.endswith(f"checkpoints/{expected_checkpoint}")
              ]
              if stray:
                  raise SystemExit(f"{distribution.name} ships unexpected checkpoints: {stray}")
              if [n for n in members if "checkpoints/archive/" in n]:
                  raise SystemExit(f"{distribution.name} leaks archived checkpoints.")
              print(f"{distribution.name}: {expected_checkpoint} and its training log present")
          PY

      - name: Verify the tag is on an integration branch
        run: |
          git fetch origin main dev --depth=50 || true
          for branch in origin/main origin/dev; do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$branch" 2>/dev/null; then
              echo "Tagged commit is contained in $branch."
              exit 0
            fi
          done
          echo "::error::Tagged commit is not an ancestor of origin/main or origin/dev."
          echo "Merge the release commit before tagging so published code matches an integration branch."
          exit 1

      - name: Install the built wheel into a clean environment and smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install -U pip
          /tmp/smoke/bin/python -m pip install dist/*.whl
          /tmp/smoke/bin/python -c "import pupil_tracking; print('version', pupil_tracking.__version__)"
          /tmp/smoke/bin/run-pupil-analysis --help

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing exchanges this workflow's OIDC identity for a short-lived
    # PyPI token, so no API token is stored in repository secrets. The publisher
    # must be configured once on PyPI before the first release. See RELEASING.md.
    environment:
      name: pypi
      url: https://pypi.org/p/mouse-pupil-analysis
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
