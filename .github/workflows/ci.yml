name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tools
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev]

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: Pre-commit hooks match the pinned dev tools
        run: pre-commit run --all-files

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu covers the supported Python range. Windows is the primary
        # development platform and macOS is the other in-use platform, so both
        # get one job each rather than the full range.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable) + dev tools
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev]

      - name: Pytest
        run: pytest

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install -U pip build
          python -m build

      - name: Install wheel into clean env + smoke test
        run: |
          python -m pip install -U pip
          python -m pip install dist/*.whl
          python -c "import mouse_pupil_analysis; print('version', mouse_pupil_analysis.__version__)"
          run-pupil-analysis --help
